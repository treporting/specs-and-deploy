    SYS-66, SYS-67, SYS-68, SYS-71, SYS-72, SYS-73, SYS-74]
  status: draft
  verification_method: [analysis]
- object_key: ARC-02
  kind: subsystem
  repo: reporter-edgedb
  object_text: 'REST API: answers trace, states, maturity and compliance from one data set; takes the
