# System architecture (r3) and the allocation (r4). What explains them is in system-architecture.md.
# Format: ../formats.md - schema: ../schemas/system-architecture.schema.json
level: r3
documents:
- name: system-architecture.md
  status: draft
  verification_method: [review]
- name: attributes.md
  status: draft
  verification_method: [review]
elements:
- object_key: ARC-01
  kind: subsystem
  repo: viewer-edgedb
  object_text: 'single page application: shows what the reporter answers - tables, charts, the trace -
    with filters, and hands tables and charts on'
  allocated: [SYS-01, SYS-02, SYS-03, SYS-04, SYS-05, SYS-06, SYS-07, SYS-08, SYS-09, SYS-10, SYS-12,
