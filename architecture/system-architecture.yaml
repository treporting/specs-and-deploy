    SYS-47, SYS-48, SYS-49, SYS-50, SYS-51, SYS-52, SYS-54, SYS-55, SYS-56, SYS-58, SYS-59, SYS-63, SYS-64,
    SYS-65, SYS-66, SYS-67, SYS-68, SYS-70, SYS-71, SYS-72, SYS-73, SYS-74, SYS-75, SYS-76]
  status: draft
  verification_method: [analysis]
- object_key: ARC-03
  kind: subsystem
  repo: storage-edgedb
  object_text: 'the model, the data sets and the `Source` interface over them - a database branch, generated
    data or a data file; the generator of data of known content; the import, the same for every system:
    counts what was stored, fingerprints it, derives the mapped (`M`) values - by the configuration of
    the customer, or from the parent where the original is empty - and the intermediate status (`I`),
    sets the state and keeps the import record; the audit trail'
  allocated: [SYS-11, SYS-13, SYS-14, SYS-16, SYS-18, SYS-19, SYS-20, SYS-21, SYS-22, SYS-23, SYS-24,
    SYS-25, SYS-26, SYS-27, SYS-28, SYS-32, SYS-35, SYS-36, SYS-38, SYS-40, SYS-41, SYS-42, SYS-43, SYS-44,
    SYS-49, SYS-51, SYS-52, SYS-53, SYS-54, SYS-55, SYS-60, SYS-62, SYS-63, SYS-64, SYS-65, SYS-66, SYS-68,
    SYS-69, SYS-74, SYS-75]
  status: draft
  verification_method: [analysis]
- object_key: ARC-04
  kind: subsystem
  repo: converter-edgedb
  object_text: maps the customized attributes of an attribute-based system to the model, by a configuration
    file of the customer; one general mechanism for all of them
  allocated: [SYS-02, SYS-07, SYS-08, SYS-12, SYS-15, SYS-17, SYS-22, SYS-23, SYS-24, SYS-25, SYS-27,
    SYS-28, SYS-35, SYS-38, SYS-53, SYS-55, SYS-60, SYS-61, SYS-62, SYS-63, SYS-64, SYS-65, SYS-66, SYS-72,
    SYS-73, SYS-74]
  status: draft
  verification_method: [analysis]
- object_key: ARC-05
  kind: subsystem
  repo: extractor-content
  object_text: extracts the information the files of a file-based system hold - requirements, test cases,
    test results, annotations -, with a package for each kind of content and no plug-in mechanism. The
    package annotations reads `@implements` and `@verifies` from Go files; it is the repo reporter-annotations
    today
  allocated: [SYS-02, SYS-07, SYS-08, SYS-12, SYS-15, SYS-17, SYS-22, SYS-23, SYS-24, SYS-27, SYS-28,
    SYS-35, SYS-38, SYS-53, SYS-55, SYS-63, SYS-64, SYS-65, SYS-66, SYS-72, SYS-74]
  status: draft
  verification_method: [analysis]
- object_key: ARC-06
  kind: subsystem
  repo: extractor-SYSTEM
  object_text: 'one per system, such as extractor-git or extractor-codebeamer: connects to it, lists and
    fetches what it holds with its identity in the system - revision, commit - and counts it by a query
    of its own'
  allocated: [SYS-15, SYS-17, SYS-22, SYS-23, SYS-24, SYS-27, SYS-35, SYS-38, SYS-53, SYS-55, SYS-61,
    SYS-63, SYS-64, SYS-65, SYS-66]
  status: draft
  verification_method: [analysis]
- object_key: ARC-11
  kind: interface
  object_text: REST API
  between: viewer → reporter
  contract: swagger of reporter-edgedb
  status: draft
  verification_method: [analysis]
- object_key: ARC-12
  kind: interface
  object_text: '`Source`'
  between: reporter → storage
  contract: Go interface in storage-edgedb
  status: draft
  verification_method: [analysis]
- object_key: ARC-13
  kind: interface
  object_text: import
  between: converter-edgedb, extractor-content → storage
  contract: Go interface in storage-edgedb
  status: draft
  verification_method: [analysis]
- object_key: ARC-14
  kind: interface
  object_text: system access
  between: extractor-SYSTEM → system
  contract: 'per system: listing and fetching, and a query of its own for counting'
  status: draft
  verification_method: [analysis]
- object_key: ARC-15
  kind: interface
  object_text: files
  between: extractor-SYSTEM → extractor-content
  contract: a file with its kind and its identity in the system
  status: draft
  verification_method: [analysis]
- object_key: ARC-16
  kind: interface
  object_text: information
  between: extractor-content → storage
  contract: the information extracted, per kind, over ARC-13; for annotations the format of formats.md
  status: draft
  verification_method: [analysis]
- object_key: ARC-17
  kind: interface
  object_text: identity
  between: proxy or identity provider → reporter
  contract: identity and groups of the user, handed on by the proxy or as a token (OIDC)
  status: draft
  verification_method: [analysis]
- object_key: ARC-18
  kind: interface
  object_text: audit trail
  between: reporter → storage
  contract: Go interface in storage-edgedb
  status: draft
  verification_method: [analysis]
- object_key: ARC-19
  kind: interface
  object_text: items
  between: extractor-SYSTEM → converter-edgedb
  contract: an item with its attributes as the system holds them, and its identity in the system
  status: draft
  verification_method: [analysis]
- object_key: ARC-20
  kind: interface
  object_text: configuration
  between: customer → converter-edgedb, storage
  contract: the mapping of attributes and of values, one file per system of a customer
  status: draft
  verification_method: [analysis]
- object_key: ARC-21
  kind: model
  object_text: the information model - the common language of converter, storage and reporter; the common
    contract of ARC-12, ARC-13 and ARC-18
  contract: architecture/attributes.md
  allocated: [SYS-09, SYS-11, SYS-13, SYS-14, SYS-15, SYS-16, SYS-17, SYS-18, SYS-20, SYS-28, SYS-36,
    SYS-41, SYS-43, SYS-45, SYS-49, SYS-68, SYS-69, SYS-70, SYS-72, SYS-73, SYS-74, SYS-75, SYS-76]
  status: draft
  verification_method: [analysis]
- object_key: ARC-22
  kind: model
  object_text: the schemas of our own data - one JSON Schema per kind of YAML file, which every file of
    that kind names; a draft of the gel schema of ARC-21
  contract: schemas/
  rationale: our own data is written by hand in YAML (formats.md); a schema per kind lets a tool check
    every file (TOOL-05), and is the draft from which the gel schema of ARC-21 grows
  status: review
  verification_method: [test]
decisions:
- object_key: ARC-R01
  object_text: Read only
- object_key: ARC-D01
  object_text: Independent count (SYS-23)
- object_key: ARC-D02
  object_text: Import record (SYS-26, SYS-41)
- object_key: ARC-D03
  object_text: Original and derived values (SYS-11)
- object_key: ARC-D04
  object_text: Configuration instead of code for the customer (SYS-22)
- object_key: ARC-D05
  object_text: Identity (SYS-39) - provisional, until the threat analysis confirms or changes it
