# The levels of our process and its tools, each with its name. Tools read the name of a level from
# here. The levels of the product are in levels.yaml of specs-and-deploy-product.
# Format: formats.md, section Levels
schema: schemas/levels.schema.json
type: levels
levels:
- key: n1
  part: [product, 'process & tools']
  name: regulatory requirements
  abbreviation: REG
  description: 'the clauses of the standards and laws to be met: regulatory requirements (REG)'
  reference: ISO12207, clause 6.4.2 - stakeholder needs and requirements definition
- key: r2
  part: ['process & tools']
  name: tool requirements
  abbreviation: TOOL
  description: the requirements of the tools of our work, which are not part of the product (TOOL)
- key: r5
  part: ['process & tools']
  name: software requirements
  abbreviation: SR
  description: software requirements (SR) of the tools, in the repo tools
  reference: ISO12207, clause 6.4.3 - software requirements definition
- key: sc1
  part: ['process & tools']
  name: source code, function coverage
  abbreviation: SC
  description: the source code, measured by the share of its functions the tests call
  reference: ISO29119-4, clause 5.3 - structure-based test design
- key: r5tc
  part: ['process & tools']
  name: subsystem test
  abbreviation: SwVal
  description: the tools against their SR
  reference: ISO29119
  data: made in the test
- key: r5tp
  part: ['process & tools']
  name: subsystem test procedure
  abbreviation: SwVal TP
  description: the tests of the tools in Go that carry out the test cases of r5tc, or verify an SR directly
  reference: ISO29119
- key: r5tr
  part: ['process & tools']
  name: subsystem test result
  abbreviation: SwVal TR
  description: the result of a run of a test procedure of r5tp
  reference: ISO29119
- key: rules
  part: ['process & tools']
  name: rules
  abbreviation: PROC
  stands_for: r1
  description: the rules of our work
- key: document
  part: ['process & tools']
  name: documents
  description: a document that explains no level of requirements or tests, in Markdown, such as formats.md
