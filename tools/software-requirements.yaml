# Software requirements of the tools (r5). What explains them is in README.md.
# Format: ../formats.md - schema: ../schemas/software-requirements.schema.json
level: r5
documents:
- name: README.md
  status: draft
  verification_method: [review]
requirements:
- object_key: SR-01
  component: review
  object_text: report a criterion of the criteria file that a result of a review leaves out, and a
    criterion the result names that the file does not hold
  target_ids: [TOOL-03]
  status: approved
  verification_method: [test]
- object_key: SR-02
  component: review
  object_text: report a verdict passed where a criterion failed, and a verdict failed where every
    criterion passed
  target_ids: [TOOL-03]
  status: approved
  verification_method: [test]
- object_key: SR-03
  component: review
  object_text: report a failed criterion that carries no note
  target_ids: [TOOL-03]
  status: approved
  verification_method: [test]
- object_key: SR-04
  component: review
  object_text: report a revision reviewed that names no commit
  target_ids: [TOOL-03]
  status: approved
  verification_method: [test]
- object_key: SR-05
  component: review
  object_text: report a result whose reviewer is the author or a co-author of the last commit, not a
    merge, that changed the requirement reviewed
  target_ids: [TOOL-03]
  status: approved
  verification_method: [test]
- object_key: SR-06
  component: review
  object_text: where a criterion or the verdict of a result holds a value other than passed or failed,
    report it; count such a criterion as not passed
  target_ids: [TOOL-03]
  status: approved
  verification_method: [test]
- object_key: SR-07
  component: review
  object_text: where the criteria revision of a review names no commit that changed its criteria file,
    report it once for the review, as the criteria the review followed cannot be traced
  target_ids: [TOOL-03]
  status: approved
  verification_method: [test]
- object_key: SR-08
  component: review
  object_text: report a result whose reviewer is the author or a co-author of the last commit, not a
    merge, that changed the document reviewed
  target_ids: [TOOL-11]
  status: approved
  verification_method: [test]
- object_key: SR-09
  component: ci
  object_text: on every pull request, check every review result, and fail where a result breaks a rule;
    a pull request whose check failed cannot be merged
  target_ids: [TOOL-12]
  status: approved
  verification_method: [demonstration]
- object_key: SR-10
  component: ci
  object_text: on every pull request, run the tests of the tools on the levels MT and SwIT, and fail where
    one fails; a pull request whose tests failed cannot be merged
  target_ids: [TOOL-12]
  status: approved
  verification_method: [demonstration]
- object_key: SR-11
  component: review
  object_text: write a skeleton of a review result into reviews/, for the ids or documents given, with
    the reviewer given as created_by, and the time it is made as created_at and in its name,
    <yyyymmddThhmmss>_<scope>.yaml
  target_ids: [TOOL-04]
  status: review
  verification_method: [test]
- object_key: SR-12
  component: review
  object_text: take the criteria file of the level of what is to be reviewed, and as criteria revision
    the last commit that changed that file
  target_ids: [TOOL-04]
  status: review
  verification_method: [test]
- object_key: SR-13
  component: review
  object_text: name as revision of each the commit the skeleton is made on
  target_ids: [TOOL-04]
  status: review
  verification_method: [test]
- object_key: SR-14
  component: review
  object_text: write one result per id or document, with every criterion of the criteria file, and set
    each criterion and the verdict to todo
  target_ids: [TOOL-04]
  status: review
  verification_method: [test]
- object_key: SR-15
  component: review
  object_text: write nothing, and report it, where an id or document is not found, or where they belong
    to more than one level
  target_ids: [TOOL-04]
  status: review
  verification_method: [test]
