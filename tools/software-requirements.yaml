# Software requirements of the tools (r5). What explains them is in README.md.
# Format: ../formats.md
schema: schemas/software-requirements.schema.json
type: requirements
level: r5
documents: [tools/README.md]
requirements:
- object_key: SR_01
  object_version: '1.1.1'
  component: review
  object_text: report a criterion of the criteria file that a result of a review leaves out, and a
