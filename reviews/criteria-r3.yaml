# Review criteria of the elements of the architecture (r3), after ISO29148 read for the elements.
# An element is approved only when it passed every criterion (PROC_13). See reviews/README.md.
schema: schemas/review-criteria.schema.json
level: r3
criteria:
- object_key: RC-01
  source: REG_ISO29148_01 - necessary
  object_text: necessary - a system requirement is allocated to it, or it gives its rationale
  question: Is a system requirement allocated to it, or does it give its rationale?
- object_key: RC-02
  source: REG_ISO29148_01 - appropriate; what part of the system, not its design inside, is the rule of r3 of treporting
  object_text: appropriate - it states which part of the system it is - a subsystem, an interface, a
    model - and its responsibility, not its design inside
  question: Does it state which part of the system it is and its responsibility, naming no design inside?
- object_key: RC-03
  source: REG_ISO29148_01 - unambiguous
  object_text: unambiguous - it can be read one way only
  question: Can it be read one way only?
- object_key: RC-04
  source: REG_ISO29148_01 - singular, read for an element
  object_text: singular - it has one responsibility, not several
  question: Does it have one responsibility, not several?
- object_key: RC-05
  source: REG_ISO29148_01 - complete
  object_text: complete - it can be understood without further explanation; an interface or a model
    names its contract
  question: Can it be understood as it stands, and does an interface or a model name its contract?
- object_key: RC-06
  source: REG_ISO29148_02 - consistent, a characteristic of the set
  object_text: consistent - it contradicts no other element, no decision and no requirement
  question: Does it contradict no other element, decision or requirement?
- object_key: RC-07
  source: REG_ISO29148_01 - verifiable
  object_text: verifiable - its verification method can show that it is met
  question: Can its verification method show that it is met?
- object_key: RC-08
  source: REG_ISO29148_01 - feasible
  object_text: feasible - it can be realized with a reasonable effort
  question: Can it be realized with a reasonable effort?
- object_key: RC-09
  source: REG_ISO29148_01 - correct
  object_text: correct - it states rightly what the system requirements allocated to it ask for
  question: Does it state rightly what its allocated system requirements ask for?
- object_key: RC-10
  source: treporting - traceable and allocated, the allocation r4
  object_text: traceable - every system requirement allocated to it exists, and belongs to it
  question: Does every allocated system requirement exist, and belong to this element?
- object_key: RC-11
  source: REG_ISO29148_01 - conforming; what to conform to is set by treporting, formats.md
  object_text: conforming - it follows formats.md - id, kind, status and verification method, and a
    contract for an interface or a model
  question: Does it follow formats.md?
