# Review criteria of the tool requirements, after ISO/IEC/IEEE 29148.
# A tool requirement is approved only when it passed every criterion (PROC_13). See reviews/README.md.
schema: schemas/review-criteria.schema.json
level: tool
criteria:
- object_key: RC-01
  source: REG_ISO29148_01 - necessary
  object_text: necessary - our work needs the tool to meet its uplinks
  question: Does our work need it to meet its uplinks?
- object_key: RC-02
  source: REG_ISO29148_01 - appropriate; what, not how, is the rule of treporting for a tool
  object_text: appropriate - it names what the tool does, not how it is built
  question: Does it name what the tool does, and nothing of how it is built?
- object_key: RC-03
  source: REG_ISO29148_01 - unambiguous
  object_text: unambiguous - it can be read one way only
  question: Can it be read one way only?
- object_key: RC-04
  source: REG_ISO29148_01 - singular
  object_text: singular - it is one requirement, not several
  question: Is it one requirement, not several?
- object_key: RC-05
  source: REG_ISO29148_01 - complete
  object_text: complete - it can be understood without further explanation
  question: Can it be understood as it stands?
- object_key: RC-06
  source: REG_ISO29148_02 - consistent, a characteristic of the set of requirements
  object_text: consistent - it contradicts no other requirement
  question: Does it contradict no other requirement?
- object_key: RC-07
  source: REG_ISO29148_01 - verifiable
  object_text: verifiable - a test of the tool, or an inspection where that is its method, can show that
    it is met
  question: Can a test of the tool - or an inspection, where that is its method - show that it is met?
- object_key: RC-08
  source: REG_ISO29148_01 - feasible
  object_text: feasible - it can be met with a reasonable effort
  question: Can it be met with a reasonable effort?
- object_key: RC-09
  source: REG_ISO29148_01 - correct
  object_text: correct - it states rightly what its uplinks ask for
  question: Does it state rightly what its uplinks ask for?
- object_key: RC-10
  source: treporting - traceable; ISO/IEC/IEEE 29148, 5.2.8 - rationale
  object_text: traceable - every uplink it names - a rule of the harness or a regulatory requirement -
    exists; where it names none, it gives its rationale
  question: Does every uplink it names exist - and where it has none, does it give its rationale?
- object_key: RC-11
  source: REG_ISO29148_01 - conforming; what to conform to is set by treporting, formats.md
  object_text: conforming - it follows formats.md - id, feature, status and verification method need to be
    present
  question: Does it follow formats.md?
