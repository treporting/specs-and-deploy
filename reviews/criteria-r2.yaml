# Review criteria of the system requirements (r2), after ISO/IEC/IEEE 29148.
# A system requirement is approved only when it passed every criterion (PROC_13). See reviews/README.md.
schema: schemas/review-criteria.schema.json
level: r2
criteria:
- object_key: RC-01
  source: REG_ISO29148_01 - necessary
  object_text: necessary - it is needed to meet its uplinks
  question: Is it needed to meet its uplinks?
- object_key: RC-02
  source: REG_ISO29148_01 - appropriate; the system seen as one box is the rule of r2 of treporting
  object_text: appropriate - it speaks of the system as one box, and names no subsystem and no solution
    inside it
  question: Does it speak of the system as a whole, naming no subsystem and no solution inside it?
- object_key: RC-03
  source: REG_ISO29148_01 - unambiguous
  object_text: unambiguous - it can be read one way only
  question: Can it be read one way only?
- object_key: RC-04
  source: REG_ISO29148_01 - singular
  object_text: singular - it is one requirement, not several
  question: Is it one requirement, not several?
- object_key: RC-05
  source: REG_ISO29148_01 - complete
  object_text: complete - it can be understood without further explanation
  question: Can it be understood as it stands?
- object_key: RC-06
  source: REG_ISO29148_02 - consistent, a characteristic of the set of requirements
  object_text: consistent - it contradicts no other requirement
  question: Does it contradict no other requirement?
- object_key: RC-07
  source: REG_ISO29148_01 - verifiable
  object_text: verifiable - the system test can show that it is met
  question: Can the system test show that it is met?
- object_key: RC-08
  source: REG_ISO29148_01 - feasible
  object_text: feasible - it can be met with a reasonable effort
  question: Can it be met with a reasonable effort?
- object_key: RC-09
  source: REG_ISO29148_01 - correct
  object_text: correct - it states rightly what its uplinks ask for
  question: Does it state rightly what its uplinks ask for?
- object_key: RC-10
  source: treporting - traceable; REG_ISO29148_03 - rationale
  object_text: traceable - every uplink it names exists; where it names none, it gives its rationale
  question: Does every uplink it names exist - and where it has none, does it give its rationale?
- object_key: RC-11
  source: REG_ISO29148_01 - conforming; what to conform to is set by treporting, formats.md
  object_text: conforming - it follows formats.md - id, feature, status, verification method, platform and
    launch need to be present
  question: Does it follow formats.md?
