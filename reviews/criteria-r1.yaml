# Review criteria of the user needs (r1), after ISO/IEC/IEEE 29148.
# A need is approved only when it passed every criterion (PROC_13). See reviews/README.md.
schema: schemas/review-criteria.schema.json
level: r1
criteria:
- object_key: RC-01
  source: REG_ISO29148_01 - necessary
  object_text: necessary - the role needs it; without it, something would be missing
  question: Does the role need it - would something be missing without it?
- object_key: RC-02
  source: treporting - the rule of r1; part of appropriate in REG_ISO29148_01
  object_text: names no solution - it says what the role needs, not how it is realized
  question: Does it say what the role needs, and nothing of how it is done?
- object_key: RC-03
  source: REG_ISO29148_01 - unambiguous
  object_text: unambiguous - it can be read one way only
  question: Can it be read one way only?
- object_key: RC-04
  source: REG_ISO29148_01 - singular
  object_text: singular - it is one need, not several in one sentence
  question: Is it one need, not several?
- object_key: RC-05
  source: REG_ISO29148_01 - complete
  object_text: complete - it can be understood without further explanation
  question: Can it be understood as it stands?
- object_key: RC-06
  source: REG_ISO29148_02 - consistent, a characteristic of the set of requirements
  object_text: consistent - it contradicts no other need
  question: Does it contradict no other need?
- object_key: RC-07
  source: REG_ISO29148_01 - verifiable
  object_text: verifiable - the acceptance test can show that it is met
  question: Can the acceptance test show that it is met?
- object_key: RC-08
  source: REG_ISO29148_01 - feasible
  object_text: feasible - it can be met with a reasonable effort
  question: Can it be met with a reasonable effort?
- object_key: RC-09
  source: REG_ISO29148_01 - correct
  object_text: correct - it states what the role really needs
  question: Does it state what the role really needs?
  note: confirmed by the Product Owner, the only one who can speak for the roles - also where they are
    the author (see the roles of harness.md)
- object_key: RC-10
  source: REG_ISO29148_01 - conforming; what to conform to is set by treporting, formats.md
  object_text: conforming - it follows formats.md - id, function, status, verification method, platform
    and launch need to be present
  question: Does it follow formats.md?
