# Hazards (h1) and their controls (h2). What explains them is in hazard-and-risk-analysis.md.
# Format: ../formats.md - schema: ../schemas/hazards.schema.json
level: h1
documents:
- name: hazard-and-risk-analysis.md
  status: draft
  verification_method: [review]
hazards:
- object_key: HAZ-01
  object_text: a gap in the trace is shown as covered
  cause: a link, test case or test result missing in the data, or lost at the import
  effect: a requirement without passed test is taken as verified
  status: draft
  verification_method: [analysis]
- object_key: HAZ-02
  object_text: an unknown value is shown as zero, empty or passed
  cause: a value missing in the source turned into a default at the import or in a view
  effect: a state is taken as known that is not
  status: draft
  verification_method: [analysis]
- object_key: HAZ-03
  object_text: a filter hides objects without saying so
  cause: a filter on an attribute an object does not carry, a spelling that differs
  effect: a gap outside the view is not seen
  status: draft
  verification_method: [analysis]
- object_key: HAZ-04
  object_text: an error while reading goes unreported
  cause: an extractor or converter ends without reporting what it could not read
  effect: the data looks complete and is not
  status: draft
  verification_method: [analysis]
- object_key: HAZ-05
  object_text: a figure measures something else than its label says
  cause: a maturity read off a level name, a chart counting what the table does not
  effect: a release is judged by a number that means something else
  status: draft
  verification_method: [analysis]
- object_key: HAZ-06
  object_text: the same data gives another report
  cause: a rule changed without trace, data changed between two reports
  effect: a decision cannot be followed back to what it relied on
  status: draft
  verification_method: [analysis]
- object_key: HAZ-07
  object_text: a safety class is lost or lowered down the trace
  cause: an inherited class not carried down, a lower class without decomposition
  effect: a safety-relevant requirement is treated as QM
  status: draft
  verification_method: [analysis]
controls:
- object_key: HAZC-01
  object_text: a gap in the trace is marked as gap and never counted as covered
  target_ids: [HAZ-01]
  controls: [UN-PSF-01]
  status: draft
  verification_method: [analysis]
- object_key: HAZC-02
  object_text: an unknown value is kept and shown as unknown
  target_ids: [HAZ-02]
  controls: [UN-PSF-02]
  status: draft
  verification_method: [analysis]
- object_key: HAZC-03
  object_text: every view says which filters are in effect and what they leave out
  target_ids: [HAZ-03]
  controls: [UN-PSF-03]
  status: draft
  verification_method: [analysis]
- object_key: HAZC-04
  object_text: every import is counted on a way of its own, and every error is reported
  target_ids: [HAZ-04]
  controls: [UN-PSF-04]
  status: draft
  verification_method: [analysis]
- object_key: HAZC-05
  object_text: every figure is defined by what it counts, and its calculation is tested
  target_ids: [HAZ-05]
  controls: [UN-PSF-05]
  status: draft
  verification_method: [analysis]
- object_key: HAZC-06
  object_text: every report records the data, revision and parameters it was made from
  target_ids: [HAZ-06]
  controls: [UN-PSF-06]
  status: draft
  verification_method: [analysis]
- object_key: HAZC-07
  object_text: a safety class is carried down the trace, and a lower one without decomposition is found
  target_ids: [HAZ-07]
  controls: [UN-SAF-03]
  status: draft
  verification_method: [analysis]
