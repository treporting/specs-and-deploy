# The linters of the gate of every repo (SR_53). build.yml runs them on every Go module.
# @implements SR_53@1.1.1
version: "2"

run:
  timeout: 30m
  tests: true
  #	a path of an exclusion is read from the root of the repo
  relative-path-mode: gitroot

linters:
  default: none
  enable:
    - errcheck
    - govet
    - staticcheck
    - gosec
    - ineffassign

  exclusions:
    rules:
      #	the tools of specs-and-deploy are commands: they read the files and run the commands their
      #	user names; no input reaches them from outside
      - path: ^tools/
        linters: [gosec]
        text: "G304|G204|G703"

issues:
  #	0 is no limit: a report cut at 50 per linter looks like a short list
  max-issues-per-linter: 0
  max-same-issues: 0
