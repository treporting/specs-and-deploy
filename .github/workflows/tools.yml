# The gate of the tools on every pull request (TOOL-12, TOOL-05, TOOL-13). Each job is a required check of the ruleset
# of main, so a pull request whose job failed cannot be merged. See devops.md.
name: tools

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  reviewcheck:
    runs-on: ubuntu-latest
    steps:
      #	the whole history: a review names the revisions it reviewed
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version-file: tools/go.mod
          cache-dependency-path: tools/go.sum
      - name: reviewcheck
        working-directory: tools
        run: go run ./review/cmd/reviewcheck -root ..
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: tools/go.mod
          cache-dependency-path: tools/go.sum
      - name: vet
        working-directory: tools
        run: go vet ./... && go vet -tags integration ./...
      - name: MT
        working-directory: tools
        run: go test ./...
      - name: SwIT
        working-directory: tools
        run: go test -tags integration ./...
  schemacheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: tools/go.mod
          cache-dependency-path: tools/go.sum
      - name: schemacheck
        working-directory: tools
        run: go run ./schema/cmd/schemacheck -root ..
  rulesetcheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: tools/go.mod
          cache-dependency-path: tools/go.sum
      - name: rulesetcheck
        working-directory: tools
        env:
          #	read only: with it the limit of requests to the API is higher
          GITHUB_TOKEN: ${{ github.token }}
        run: go run ./ruleset/cmd/rulesetcheck -root ..
