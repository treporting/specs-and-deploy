# The documents of a commit or tag as one ZIP of PDFs (TOOL_01), started by hand: Actions, pdf, Run
# workflow, with the commit or tag. The work is in pdf.yml of tools; see its README.md, section pdf.
name: pdf

on:
  workflow_dispatch:
    inputs:
      ref:
        description: the commit or tag, such as T044
        required: true
        type: string

permissions:
  contents: read

jobs:
  pdf:
    uses: treporting/tools/.github/workflows/pdf.yml@main
    with:
      ref: ${{ inputs.ref }}
