# The baseline of specs-and-deploy, started by the label baseline on one of its tickets (TOOL_27).
# The work is in baseline.yml; see tools/README.md, section baseline.
#
# @implements SR_61@1.1.1
name: ticket-baseline

on:
  issues:
    types: [labeled]

permissions:
  contents: read

jobs:
  baseline:
    if: github.event.label.name == 'baseline'
    uses: ./.github/workflows/baseline.yml
    with:
      go-version-file: tools/go.mod
    secrets: inherit
