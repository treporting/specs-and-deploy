# The baseline of specs-and-deploy, started by the label baseline on one of its tickets (TOOL_27).
# The work is in baseline.yml of tools; see its README.md, section baseline. This repo holds no code:
# the steps take the version of Go from the tools.
name: ticket-baseline

on:
  issues:
    types: [labeled]

permissions:
  contents: read

jobs:
  baseline:
    if: github.event.label.name == 'baseline'
    uses: treporting/tools/.github/workflows/baseline.yml@main
    with:
      go-version-file: .build-steps/go.mod
    secrets: inherit
