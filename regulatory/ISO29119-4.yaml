requirements:
- object_key: REG_ISO29119-4_01
  object_version: '1.1.1'
  category: Normative
  object_text: '5.2 - specification-based test design techniques - test cases are derived from what
    the item is to do: equivalence partitioning, boundary value analysis, the classification tree
    method, decision table testing, state transition testing, scenario testing, syntax testing,
    combinatorial testing such as pairwise testing, cause-effect graphing, random testing,
    metamorphic testing, and requirements-based testing'
  applies_to: all
  not_realized: kept by our work, not by the product - in the test cases of treporting
  priority: 'medium'
  safety: ''
  status: review
  verification_method: [inspection]
- object_key: REG_ISO29119-4_02
  object_version: '1.1.1'
  category: Normative
  object_text: '5.3 - structure-based test design techniques - test cases are derived from the
    structure of the code: statement testing, branch testing, decision testing, branch condition
    testing, branch condition combination testing, modified condition/decision coverage (MC/DC),
    and data flow testing'
  applies_to: all
  not_realized: kept by our work, not by the product - in the test cases of treporting
  priority: 'medium'
  safety: ''
  status: review
  verification_method: [inspection]
