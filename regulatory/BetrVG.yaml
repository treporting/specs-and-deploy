type: normative
level: n1
requirements:
- object_key: REG_BetrVG_01
  object_version: '1.1.1'
  category: Normative
  object_text: |-
    §87(1) no. 6, (2) - (1) Der Betriebsrat hat, soweit eine gesetzliche oder tarifliche Regelung nicht besteht, in
    folgenden Angelegenheiten mitzubestimmen: … 6. Einführung und Anwendung von technischen
    Einrichtungen, die dazu bestimmt sind, das Verhalten oder die Leistung der Arbeitnehmer zu
    überwachen; …
    (2) Kommt eine Einigung über eine Angelegenheit nach Absatz 1 nicht zustande, so entscheidet die
    Einigungsstelle. Der Spruch der Einigungsstelle ersetzt die Einigung zwischen Arbeitgeber und
    Betriebsrat.

    the introduction and use of a technical means meant to monitor the behaviour or performance of
    employees is co-determined by the works council - by an agreement, or else by a ruling of the
    conciliation board
  applies_to: Germany
  priority: 'medium'
  safety: ''
  status: approved
  verification_method: [inspection]
