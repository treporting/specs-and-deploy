# Regulatory requirements of EU2024-2847 (n1). What explains them is in regulatory-requirements.md.
# Format: ../formats.md
schema: schemas/regulatory-requirements.schema.json
level: n1
requirements:
- object_key: REG_EU2024-2847_01
  object_version: '1.1.1'
  category: Normative
  object_text: 'Annex I Part I - a product with digital elements is designed and produced for a
    level of cybersecurity appropriate to its risks, and placed on the market without known
    exploitable vulnerabilities, with a secure configuration by default, securable by updates, and
    with the further properties of Annex I Part I (2)'
  applies_to: products with digital elements made available on the EU market in the course of a
    commercial activity - not free and open-source software that is not monetised
  priority: 'medium'
  safety: ''
  status: draft
  verification_method: [inspection]
- object_key: REG_EU2024-2847_02
  object_version: '1.1.1'
  category: Normative
  object_text: 'Annex I Part II - the manufacturer handles vulnerabilities: keeps an SBOM, fixes
    without delay, tests and reviews the product regularly, discloses fixed vulnerabilities, has a
    policy of coordinated disclosure and a contact for reports, and distributes security updates
    securely, without delay and free of charge'
  applies_to: products with digital elements made available on the EU market in the course of a
    commercial activity - not free and open-source software that is not monetised
  priority: 'medium'
  safety: ''
  status: draft
  verification_method: [inspection]
- object_key: REG_EU2024-2847_03
  object_version: '1.1.1'
  category: Normative
  object_text: 'Art. 14 - an actively exploited vulnerability is notified to the CSIRT designated as
    coordinator and to ENISA: an early warning within 24 hours, a notification within 72 hours, a
    final report within 14 days after a corrective or mitigating measure is available'
  applies_to: products with digital elements made available on the EU market in the course of a
    commercial activity - not free and open-source software that is not monetised
  not_realized: a duty of the manufacturer, kept by our work (harness)
  priority: 'medium'
  safety: ''
  status: draft
  verification_method: [inspection]
- object_key: REG_EU2024-2847_04
  object_version: '1.1.1'
  category: Normative
  object_text: 'Art. 13(8) - vulnerabilities are handled over the support period, at least five
    years unless the product is expected to be in use for a shorter time'
  applies_to: products with digital elements made available on the EU market in the course of a
    commercial activity - not free and open-source software that is not monetised
  priority: 'medium'
  safety: ''
  status: draft
  verification_method: [inspection]
