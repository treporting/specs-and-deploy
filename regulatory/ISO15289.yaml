# Regulatory requirements of ISO15289 (n1). What explains them is in regulatory-requirements.md.
# Format: ../formats.md
schema: schemas/regulatory-requirements.schema.json
type: normative
level: n1
requirements:
- object_key: REG_ISO15289_01
  object_version: '1.1.1'
  category: Normative
  object_text: '6.2 - records compared to information items - a record is evidence that a process was
    carried out or what it reached; an information item, such as a plan, a procedure or a
    specification, tells what is to be done. A record need not be controlled like a document; it may
    simply be logged'
  applies_to: all
  not_realized: kept by our work, not by the product - the documents and records of treporting
  priority: 'medium'
  safety: ''
  status: review
  verification_method: [inspection]
- object_key: REG_ISO15289_02
  object_version: '1.1.1'
  category: Normative
  object_text: '9.1 - records, general - every process gives records as evidence of what was done and
    reached; where and in what form they are kept, the organization decides; not every piece of raw
    data is a record'
  applies_to: all
  not_realized: kept by our work, not by the product - the records of treporting
  priority: 'medium'
  safety: ''
  status: review
  verification_method: [inspection]
- object_key: REG_ISO15289_03
  object_version: '1.1.1'
  category: Normative
  object_text: '9.2 - generic content of a record - each record has an identifier of its own, names
    the process or activity that gave it, carries its date, names who made or checked it, links to
    the items, changes and problems it concerns, and holds its result'
  applies_to: all
  not_realized: kept by our work, not by the product - the records of treporting
  priority: 'medium'
  safety: ''
  status: review
  verification_method: [inspection]
- object_key: REG_ISO15289_04
  object_version: '1.1.1'
  category: Normative
  object_text: '9.3 - specific records - the records of acceptance, assessment, configuration,
    verification and validation each hold the generic content and what their process needs'
  applies_to: all
  not_realized: kept by our work, not by the product - the records of treporting
  priority: 'medium'
  safety: ''
  status: review
  verification_method: [inspection]
- object_key: REG_ISO15289_05
  object_version: '1.1.1'
  category: Normative
  object_text: '9.3 - acceptance record - the acquirer confirms that the acceptance criteria are met;
    it lists the discrepancies accepted, the tasks still open and the waivers granted at the handover'
  applies_to: all
  not_realized: kept by our work, not by the product - the records of treporting
  priority: 'medium'
  safety: ''
  status: review
  verification_method: [inspection]
- object_key: REG_ISO15289_06
  object_version: '1.1.1'
  category: Normative
  object_text: '9.3 - assessment record (audit record) - what was assessed, the findings of
    non-compliance, the corrective actions they gave, and the status the assessor set'
  applies_to: all
  not_realized: kept by our work, not by the product - the records of treporting
  priority: 'medium'
  safety: ''
  status: review
  verification_method: [inspection]
- object_key: REG_ISO15289_07
  object_version: '1.1.1'
  category: Normative
  object_text: '9.3 - configuration record - the physical and functional characteristics of the
    configuration items, the history of their versions, the current baselines, the changes pending
    and the problems linked to them'
  applies_to: all
  not_realized: kept by our work, not by the product - the records of treporting
  priority: 'medium'
  safety: ''
  status: review
  verification_method: [inspection]
- object_key: REG_ISO15289_08
  object_version: '1.1.1'
  category: Normative
  object_text: '9.3 - verification record - the results of the tests run, the environment they ran
    in, the limits tested, the anomalies found, and a verdict, passed or failed, against the criteria
    of the verification'
  applies_to: all
  not_realized: kept by our work, not by the product - the records of treporting
  priority: 'medium'
  safety: ''
  status: review
  verification_method: [inspection]
- object_key: REG_ISO15289_09
  object_version: '1.1.1'
  category: Normative
  object_text: '9.3 - validation record - evidence that the system fits its intended use: the
    conditions of the field tests, the confirmation of the users, and the data that show the system
    meets its constraints in real use'
  applies_to: all
  not_realized: kept by our work, not by the product - the records of treporting
  priority: 'medium'
  safety: ''
  status: review
  verification_method: [inspection]
