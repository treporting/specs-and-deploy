  source_ids: [PROC-14@1.1.1]
  priority: 'medium'
  safety: ''
  status: review
  verification_method: [test]
- object_key: TOOL-15
  object_version: '1.1.1'
  feature: Reviews
  object_text: report a requirement or a document that is approved in a pull request, where it was not
    approved in the base commit or its x rose, and that no passed review result of the pull request
