# Tool requirements. What explains them is in tool-requirements.md.
# Format: ../formats.md
schema: schemas/tool-requirements.schema.json
type: requirements
level: tool
documents: [requirements/tool-requirements.md]
requirements:
- object_key: TOOL_01
  object_version: '1.1.1'
  feature: Documents to PDF
  object_text: export every document to PDF with the settings kept in the repo - the title of the document
    and the name of the repo in the header, the date and the page of the pages in the footer, margins
    of 2 cm at top and bottom
  source_ids: [REG_FDADI_01@1.1.1]
  priority: 'medium'
  platform_launch: treporting = 2_tools
  safety: ''
  status: draft
  verification_method: [inspection]
- object_key: TOOL_02
  object_version: '1.1.1'
  feature: Documents to PDF
  object_text: show in the header or footer of an exported document its version, its revision and its
    own status
  source_ids: [REG_FDADI_01@1.1.1]
  priority: 'medium'
  platform_launch: treporting = 2_tools
  safety: ''
  status: draft
  verification_method: [test]
- object_key: TOOL_03
  object_version: '1.2.2'
  feature: Reviews
  object_text: check every review result - every criterion of its criteria file once, the verdict passed
    only when every criterion passed, a note to every failed criterion, the revision reviewed exists,
    and the reviewer is not the author of the requirement
  source_ids: [PROC_13@2.1.1, PROC_15@1.1.1]
  priority: 'medium'
  platform_launch: treporting = 1_tools
  safety: ''
  status: approved
  verification_method: [test]
- object_key: TOOL_04
  object_version: '1.1.2'
  feature: Reviews
  object_text: create the skeleton of a review for a set of requirements or documents, with the criteria
    of their level and the revision of each
  rationale: the automatic support of the review - it gathers the criteria of the level and the revision
    of each requirement, so that the reviewer does not copy them by hand and makes no mistake there
  priority: 'medium'
  platform_launch: treporting = 1_tools
  safety: ''
  status: approved
  verification_method: [test]
- object_key: TOOL_05
  object_version: '1.1.2'
  feature: CI check
  object_text: check on every pull request that every YAML file matches its schema
  source_ids: [PROC_04@1.1.1]
  priority: 'medium'
  platform_launch: treporting = 1_tools
  safety: ''
  status: approved
  verification_method: [test]
- object_key: TOOL_06
  object_version: '2.1.2'
  feature: CI check
  object_text: check on every pull request that every id named in `@implements`, `@verifies` or `@refines`
    exists, and is approved, in the base commit of the pull request
  source_ids: [PROC_05@1.1.1]
  priority: 'medium'
  platform_launch: treporting = 1_tools
  safety: ''
  status: approved
  verification_method: [test]
- object_key: TOOL_07
  object_version: '1.1.2'
  feature: CI check
  object_text: count the annotations of a repo a second way, apart from the parser, and fail where the two
    counts differ
  rationale: tool error detection - a count made by the parser shares every error of the parser and
    cannot find one, as SYS_23 asks of the product for an import
  priority: 'medium'
  platform_launch: treporting = 3_tools
  safety: ''
  status: approved
  verification_method: [test]
- object_key: TOOL_08
  object_version: '1.1.2'
  feature: CI check
  object_text: check that the system requirement a software requirement names as uplink exists in
    specs-and-deploy on main, and is allocated to the subsystem of the software requirement
  source_ids: [PROC_12@2.1.1]
  priority: 'medium'
  platform_launch: treporting = 3_tools
  safety: ''
  status: approved
  verification_method: [test]
- object_key: TOOL_09
  object_version: '3.2.2'
  feature: CI check
  object_text: check that an approved requirement names approved requirements only as its uplinks
  source_ids: [PROC_13@2.1.1]
  priority: 'medium'
  platform_launch: treporting = 1_tools
  safety: ''
  status: approved
  verification_method: [test]
- object_key: TOOL_10
  object_version: '1.1.2'
  feature: CI check
  object_text: check that every test file belongs to exactly one test level
  source_ids: [PROC_19@1.1.1]
  priority: 'medium'
  platform_launch: treporting = 3_tools
  safety: ''
  status: approved
  verification_method: [test]
- object_key: TOOL_11
  object_version: '1.1.2'
  feature: Reviews
  object_text: check that the reviewer of a document is not its author - the author or a co-author of
    the last commit that changed it
  source_ids: [PROC_15@1.1.1]
  priority: 'medium'
  platform_launch: treporting = 1_tools
  safety: ''
  status: approved
  verification_method: [test]
- object_key: TOOL_12
  object_version: '1.2.2'
  feature: CI check
  object_text: check every review result and run the tests of the tools on every pull request; a pull
    request where one of them fails cannot be merged
  source_ids: [PROC_04@1.1.1, PROC_13@2.1.1]
  priority: 'medium'
  platform_launch: treporting = 1_tools
  safety: ''
  status: approved
  verification_method: [test]
- object_key: TOOL_13
  object_version: '1.1.2'
  feature: CI check
  object_text: check on every pull request that the ruleset of main on GitHub has the rules of
    .github/rulesets/main.json - all that can be read without the rights of an admin
  source_ids: [PROC_03@1.1.1]
  priority: 'medium'
  platform_launch: treporting = 1_tools
  safety: ''
  status: approved
  verification_method: [test]
- object_key: TOOL_14
  object_version: '1.1.2'
  feature: Versions
  object_text: check on every pull request that every requirement and document changed against the base
    commit carries the right version - each part one higher where its kind changed since the base
    commit and the others the same, the version of a draft unchanged, a new one at 1.1.1
  source_ids: [PROC_14@1.1.1]
  priority: 'medium'
  platform_launch: treporting = 3_tools
  safety: ''
  status: approved
  verification_method: [test]
- object_key: TOOL_15
  object_version: '1.2.2'
  feature: Reviews
  object_text: report a requirement or a document that is approved in a pull request, where it was not
    approved in the base commit or its x rose, and that no passed review result of the pull request
    names
  source_ids: [PROC_13@2.1.1, PROC_14@1.1.1]
  priority: 'medium'
  platform_launch: treporting = 3_tools
  safety: ''
  status: approved
  verification_method: [test]
- object_key: TOOL_16
  object_version: '1.1.2'
  feature: Versions
  object_text: make the link check on every pull request - for every link, entry of the allocation and
    annotation, compare the version it names with the version its object has - and report each whose
    object has another x than it names, without failing
  source_ids: [PROC_20@2.1.1]
  priority: 'medium'
  platform_launch: treporting = 1_tools
  safety: ''
  status: approved
  verification_method: [test]
- object_key: TOOL_17
  object_version: '1.1.2'
  feature: Versions
  object_text: refuse to make a baseline that holds both ends of a suspect link, compared with the
    versions in that baseline
  source_ids: [PROC_06@1.1.1, PROC_20@2.1.1]
  priority: 'medium'
  platform_launch: treporting = 3_tools
  safety: ''
  status: approved
  verification_method: [test]
- object_key: TOOL_18
  object_version: '1.1.2'
  feature: Versions
  object_text: update a link, an entry of the allocation or an annotation, named by the one who calls
    it, to the version its object has now
  source_ids: [PROC_20@2.1.1]
  priority: 'medium'
  platform_launch: treporting = 3_tools
  safety: ''
  status: approved
  verification_method: [test]
- object_key: TOOL_19
  object_version: '1.1.2'
  feature: Versions
  object_text: check on every pull request that the object_hash of every approved document is the hash
    of its file
  source_ids: [PROC_14@1.1.1]
  priority: 'medium'
  platform_launch: treporting = 3_tools
  safety: ''
  status: approved
  verification_method: [test]
- object_key: TOOL_20
  object_version: '2.1.2'
  feature: CI check
  object_text: check on every pull request that every `@implements`, `@verifies` and `@refines` names the
    version of its id, as `ID@x.y.z`
  source_ids: [PROC_20@2.1.1]
  priority: 'medium'
  platform_launch: treporting = 1_tools
  safety: ''
  status: approved
  verification_method: [test]
- object_key: TOOL_21
  object_version: '2.1.2'
  feature: sbom
  object_text: 'create the SBOM per subsystem as sbom.md from its baseline containing every package it
    delivers, its own and third-party, with its: - name, - version, - licence and - PURL'
  source_ids: [PROC_08@2.2.1]
  priority: 'medium'
  platform_launch: treporting = 1_tools
  safety: ''
  status: approved
  verification_method: [test]
- object_key: TOOL_22
  object_version: '1.1.2'
  feature: licence check
  object_text: 'check that the licence of every package in sbom.md allows delivering the subsystem under
    Apache-2.0, and fail where it does not or is unknown'
  source_ids: [PROC_08@2.2.1]
  priority: 'medium'
  platform_launch: treporting = 1_tools
  safety: ''
  status: approved
  verification_method: [test]
- object_key: TOOL_23
  object_version: '1.1.1'
  feature: build steps
  object_text: build every Go module and every JavaScript package of a repo, and fail where one does not
    build
  source_ids: [PROC_04@1.1.1]
  priority: 'medium'
  platform_launch: treporting = 1_tools
  safety: ''
  status: approved
  verification_method: [test]
- object_key: TOOL_24
  object_version: '1.1.1'
  feature: build steps
  object_text: run the linters on all code of a repo - golangci-lint for Go, eslint for JavaScript - and
    fail on any finding
  source_ids: [PROC_04@1.1.1]
  priority: 'medium'
  platform_launch: treporting = 1_tools
  safety: ''
  status: approved
  verification_method: [test]
- object_key: TOOL_25
  object_version: '1.1.1'
  feature: build steps
  object_text: run the tests of every test level of a repo, and fail where one fails
  source_ids: [PROC_04@1.1.1]
  priority: 'medium'
  platform_launch: treporting = 1_tools
  safety: ''
  status: approved
  verification_method: [test]
- object_key: TOOL_26
  object_version: '1.1.1'
  feature: build steps
  object_text: report the test coverage and the structural debt of a repo, without failing
  rationale: step 5 of the loop for every release or library in harness.md - the report shows what is
    not tested and what is not used, so that it can shrink; it blocks nothing, so it is not part of the
    gate of PROC_04
  priority: 'medium'
  platform_launch: treporting = 1_tools
  safety: ''
  status: approved
  verification_method: [test]
- object_key: TOOL_27
  object_version: '1.1.1'
  feature: baseline
  object_text: prepare on request the baseline of a repo with a given label - run the loop for every
    release or library on the head of main up to the check of the licences, and open a pull request
    with its sbom.md only where every step passes
  source_ids: [PROC_06@1.1.1, PROC_08@2.2.1]
  priority: 'medium'
  platform_launch: treporting = 1_tools
  safety: ''
  status: approved
  verification_method: [demonstration]
