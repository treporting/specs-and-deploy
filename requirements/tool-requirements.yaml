  source_ids: [PROC-06@1.1.1, PROC-20@2.1.1]
  priority: 'medium'
  safety: ''
  status: review
  verification_method: [test]
- object_key: TOOL-18
  object_version: '1.1.1'
  feature: Versions
  object_text: update a link, an entry of the allocation or an annotation, named by the one who calls
    it, to the version its object has now
  source_ids: [PROC-20@2.1.1]
  priority: 'later'
  safety: ''
