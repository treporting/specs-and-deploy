  source_ids: [PROC-13@1.1.1, PROC-14@1.1.1]
  priority: 'medium'
  safety: ''
  status: review
  verification_method: [test]
- object_key: TOOL-16
  object_version: '1.1.1'
  feature: Versions
  object_text: make the link check on every pull request - for every link, entry of the allocation and
