requirements:
- object_key: TOOL-01
  object_version: '1.1.1'
  feature: Documents to PDF
  object_text: export every document to PDF with the settings kept in the repo - the title of the document
    and the name of the repo in the header, the date and the page of the pages in the footer, margins
    of 2 cm at top and bottom
  source_ids: [REG-10@1.1.1]
  priority: 'medium'
  safety: ''
  status: draft
  verification_method: [inspection]
- object_key: TOOL-02
  object_version: '1.1.1'
  feature: Documents to PDF
  object_text: show in the header or footer of an exported document its version, its revision and its
    own status
  source_ids: [REG-10@1.1.1]
  priority: 'medium'
  safety: ''
  status: draft
  verification_method: [test]
- object_key: TOOL-03
  object_version: '1.1.1'
  feature: Reviews
  object_text: check every review result - every criterion of its criteria file once, the verdict passed
    only when every criterion passed, a note to every failed criterion, the revision reviewed exists,
    and the reviewer is not the author of the requirement
  source_ids: [PROC-13@1.1.1, PROC-15@1.1.1]
  priority: 'medium'
  safety: ''
  status: approved
  verification_method: [test]
- object_key: TOOL-04
  object_version: '1.1.1'
  feature: Reviews
  object_text: create the skeleton of a review for a set of requirements or documents, with the criteria
    of their level and the revision of each
  rationale: the automatic support of the review - it gathers the criteria of the level and the revision
    of each requirement, so that the reviewer does not copy them by hand and makes no mistake there
  priority: 'medium'
  safety: ''
  status: approved
  verification_method: [test]
- object_key: TOOL-05
  object_version: '1.1.1'
  feature: CI check
  object_text: check on every pull request that every YAML file matches its schema
  source_ids: [PROC-04@1.1.1]
  priority: 'medium'
  safety: ''
  status: approved
  verification_method: [test]
- object_key: TOOL-06
  object_version: '1.1.1'
  feature: CI check
  object_text: check on every pull request that every id named in `@implements` or `@verifies` exists, and
    is approved, in the base commit of the pull request
  source_ids: [PROC-05@1.1.1]
  priority: 'medium'
  safety: ''
  status: approved
  verification_method: [test]
- object_key: TOOL-07
  object_version: '1.1.1'
  feature: CI check
  object_text: count the annotations of a repo a second way, apart from the parser, and fail where the two
    counts differ
  rationale: tool error detection - a count made by the parser shares every error of the parser and
    cannot find one, as SYS-23 asks of the product for an import
  priority: 'medium'
  safety: ''
  status: approved
  verification_method: [test]
- object_key: TOOL-08
  object_version: '1.1.1'
  feature: CI check
  object_text: check that the system requirement a software requirement names as uplink exists in
    specs-and-deploy on main, and is allocated to the subsystem of the software requirement
  source_ids: [PROC-12@2.1.1]
  priority: 'medium'
  safety: ''
  status: approved
  verification_method: [test]
- object_key: TOOL-09
  object_version: '3.1.1'
  feature: CI check
  object_text: check that an approved requirement names approved requirements only as its uplinks
  source_ids: [PROC-13@1.1.1]
  priority: 'medium'
  safety: ''
  status: approved
  verification_method: [test]
- object_key: TOOL-10
  object_version: '1.1.1'
  feature: CI check
  object_text: check that every test file belongs to exactly one test level
  source_ids: [PROC-19@1.1.1]
  priority: 'medium'
  safety: ''
  status: approved
  verification_method: [test]
- object_key: TOOL-11
  object_version: '1.1.1'
  feature: Reviews
  object_text: check that the reviewer of a document is not its author - the author or a co-author of
    the last commit that changed it
  source_ids: [PROC-15@1.1.1]
  priority: 'medium'
  safety: ''
  status: approved
  verification_method: [test]
- object_key: TOOL-12
  object_version: '1.1.1'
  feature: CI check
  object_text: check every review result and run the tests of the tools on every pull request; a pull
    request where one of them fails cannot be merged
  source_ids: [PROC-04@1.1.1, PROC-13@1.1.1]
  priority: 'medium'
  safety: ''
  status: approved
  verification_method: [test]
- object_key: TOOL-13
  object_version: '1.1.1'
  feature: CI check
  object_text: check on every pull request that the ruleset of main on GitHub has the rules of
    .github/rulesets/main.json - all that can be read without the rights of an admin
  source_ids: [PROC-03@1.1.1]
  priority: 'medium'
  safety: ''
  status: approved
  verification_method: [test]
- object_key: TOOL-14
  object_version: '1.1.1'
  feature: Versions
  object_text: check on every pull request that every requirement and document changed against the base
    commit carries the right version - each part one higher where its kind changed since the base
