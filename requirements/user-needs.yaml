# User needs (r1). What explains them is in user-needs.md.
# Format: ../formats.md - schema: ../schemas/user-needs.schema.json
level: r1
requirements:
- object_key: UN-PM-01
  function: PM
  object_text: Sees how far each feature has got, down all levels, in a release.
  status: draft
  verification_method: [test]
  platform_launch: treporting = 2_selfhosted, 1_demo
- object_key: UN-PM-02
  function: PM
  object_text: Narrows any view to the functions, features, priorities, platforms and launches of the
    own scope.
  status: draft
  verification_method: [test]
  platform_launch: treporting = 2_selfhosted, 1_demo
- object_key: UN-PM-03
  function: PM
  object_text: Sees where the chain from requirement to test result breaks, to plan the work there.
  status: draft
  verification_method: [test]
  platform_launch: treporting = 2_selfhosted, 1_demo
- object_key: UN-RM-01
  function: RM
  object_text: Sees which of its requirements are not yet backed by passed tests.
  status: draft
  verification_method: [test]
  platform_launch: treporting = 2_selfhosted, 1_demo
- object_key: UN-RM-02
  function: RM
  object_text: Sees whether maturity grows from release to release and from library to library.
  status: draft
  verification_method: [test]
  platform_launch: treporting = 2_selfhosted, 1_demo
- object_key: UN-RM-03
  function: RM
  object_text: Knows which build and which data a report was made from.
  status: draft
  verification_method: [test]
  platform_launch: treporting = 2_selfhosted, 1_demo
- object_key: UN-RM-04
  function: RM
  object_text: Hands a report on to people who do not use the system.
  status: draft
  verification_method: [test]
  platform_launch: treporting = 2_selfhosted, 1_demo
- object_key: UN-RM-05
  function: RM
  object_text: Approves a release, and may use the reported data as information for it.
  status: draft
  verification_method: [test]
  platform_launch: treporting = 2_selfhosted, 1_demo
- object_key: UN-CM-01
  function: CM
  object_text: Knows which documents, at which revision, belong to which baseline.
