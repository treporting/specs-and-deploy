  verification_method: [test]
  platform_launch: treporting = 2_selfhosted, 1_demo
- object_key: UN-CM-02
  function: CM
  object_text: Knows which tool holds which documents.
  status: draft
  verification_method: [test]
  platform_launch: treporting = 2_selfhosted, 1_demo
