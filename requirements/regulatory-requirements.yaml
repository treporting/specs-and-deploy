  category: Personal data and legal notice
  source: BetrVG, §87(1) no. 6
  object_text: a technical means that can monitor the behaviour or performance of employees needs the
    consent of the works council
  applies_to: Germany
  priority: 'medium'
  safety: ''
  status: draft
  verification_method: [inspection]
- object_key: REG-13
  object_version: '1.1.1'
  category: Personal data and legal notice
