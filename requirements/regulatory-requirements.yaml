requirements:
- object_key: REG-01
  object_version: '1.1.1'
  category: Tool qualification
  source: ISO 26262-8, clause 11
  object_text: classify a software tool by its impact and by how surely its errors are detected (TI, TD,
    TCL), and qualify it where the confidence level is TCL2 or TCL3
  applies_to: automotive
  priority: 'medium'
  safety: ''
  status: approved
  verification_method: [inspection]
- object_key: REG-02
  object_version: '1.1.1'
  category: Tool qualification
  source: IEC 61508-3, 7.4.4
  object_text: show that an offline support tool of class T2, which can fail to reveal a defect, is fit
    for its use
  applies_to: industry, railway (EN 50716)
  priority: 'medium'
  safety: ''
  status: approved
  verification_method: [inspection]
- object_key: REG-03
  object_version: '1.1.1'
  category: Tool qualification
  source: 'DO-178C, 12.2; DO-330'
  object_text: 'a tool that eliminates, reduces or automates a process of DO-178C and whose output is
    not verified otherwise is qualified; it gets a tool qualification level (TQL) from the software
    level and its function as a tool, not the software level itself, and is qualified by the process of
    DO-330 for that TQL'
  applies_to: airborne
  priority: 'medium'
  safety: ''
  status: approved
  verification_method: [inspection]
- object_key: REG-04
  object_version: '1.1.1'
  category: Tool qualification
  source: ISO 13485, 4.1.6
  object_text: 'document procedures to validate software used in the quality management system, and
    validate it before its first use and after changes, with an approach and an effort proportionate to
    its risk'
  applies_to: medical
  priority: 'medium'
  safety: ''
  status: approved
  verification_method: [inspection]
- object_key: REG-05
  object_version: '1.1.1'
  category: Electronic records
  source: 21 CFR 11.10(e)
  object_text: keep a secure, computer-generated audit trail with time stamps of every creation, change
    and deletion of a record, without hiding what was there before
  applies_to: medical (FDA)
  priority: 'medium'
  safety: ''
  status: approved
  verification_method: [inspection]
- object_key: REG-06
  object_version: '1.1.1'
  category: Electronic records
  source: 21 CFR 11.10(d), (g)
  object_text: let only authorised people use the system, and check their authority for what they do
  applies_to: medical (FDA)
  priority: 'medium'
  safety: ''
  status: approved
  verification_method: [inspection]
- object_key: REG-07
  object_version: '1.1.1'
  category: Electronic records
  source: 21 CFR 11.10(b)
  object_text: produce accurate and complete copies of records, readable by people and in electronic form
  applies_to: medical (FDA)
  priority: 'medium'
  safety: ''
  status: approved
  verification_method: [inspection]
- object_key: REG-08
  object_version: '1.1.1'
  category: Electronic records
  source: 21 CFR 11.10(c)
  object_text: protect records so that they can be retrieved accurately throughout their retention period
  applies_to: medical (FDA)
  priority: 'medium'
  safety: ''
  status: approved
  verification_method: [inspection]
- object_key: REG-09
  object_version: '1.1.1'
  category: Electronic records
  source: 21 CFR 11.50, 11.70
  object_text: an electronic signature shows the name of the signer, the time and its meaning, and is
    bound to its record so that it cannot be moved to another
  applies_to: medical (FDA)
  not_realized: treporting signs nothing; an approval is made where the organization makes it, and can
    name the report it relied on (SYS-43)
  priority: 'medium'
  safety: ''
  status: approved
  verification_method: [inspection]
- object_key: REG-10
  object_version: '1.1.1'
  category: Electronic records
  source: 'FDA, Data Integrity and Compliance With Drug CGMP - Guidance for Industry (2018)'
  object_text: 'data are complete, consistent and accurate - attributable, legible, contemporaneously
    recorded, original or a true copy, and accurate (ALCOA)'
  applies_to: medical (FDA)
  priority: 'medium'
  safety: ''
  status: approved
  verification_method: [inspection]
- object_key: REG-11
  object_version: '1.1.1'
  category: Personal data and legal notice
  source: GDPR, Art. 5(1)(b), (e)
  object_text: process personal data only for the purposes stated, and keep it no longer than they need
  applies_to: EU
  priority: 'medium'
  safety: ''
  status: approved
  verification_method: [inspection]
- object_key: REG-12
  object_version: '1.1.1'
  category: Personal data and legal notice
  source: 'BetrVG, §87(1) no. 6, (2)'
  object_text: |-
    (1) Der Betriebsrat hat, soweit eine gesetzliche oder tarifliche Regelung nicht besteht, in
    folgenden Angelegenheiten mitzubestimmen: … 6. Einführung und Anwendung von technischen
    Einrichtungen, die dazu bestimmt sind, das Verhalten oder die Leistung der Arbeitnehmer zu
    überwachen; …
    (2) Kommt eine Einigung über eine Angelegenheit nach Absatz 1 nicht zustande, so entscheidet die
    Einigungsstelle. Der Spruch der Einigungsstelle ersetzt die Einigung zwischen Arbeitgeber und
    Betriebsrat.

    the introduction and use of a technical means meant to monitor the behaviour or performance of
    employees is co-determined by the works council - by an agreement, or else by a ruling of the
    conciliation board
  applies_to: Germany
  priority: 'medium'
  safety: ''
  status: approved
  verification_method: [inspection]
- object_key: REG-13
  object_version: '1.1.1'
  category: Personal data and legal notice
  source: 'DDG, §5(1); GDPR, Art. 13(1)'
  object_text: |-
    Diensteanbieter haben für geschäftsmäßige, in der Regel gegen Entgelt angebotene digitale Dienste
    folgende Informationen, die leicht erkennbar und unmittelbar erreichbar sein müssen, ständig
    verfügbar zu halten: … (DDG, §5(1))
    Werden personenbezogene Daten bei der betroffenen Person erhoben, so teilt der Verantwortliche der
    betroffenen Person zum Zeitpunkt der Erhebung dieser Daten Folgendes mit: … (DSGVO, Art. 13(1))

    a digital service offered in business, as a rule for payment, keeps who runs it easy to recognize,
    directly reachable and always available; where personal data are collected from a user, the
    controller tells them at that time who is responsible, the purposes and the legal basis, the
    recipients, and the further information of Art. 13
  applies_to: Germany, EU
  priority: 'medium'
  safety: ''
  status: approved
  verification_method: [inspection]
- object_key: REG-19
  object_version: '1.1.1'
  category: Safety classes
  source: ISO 26262-9, clause 5; ISO 26262-3, -4, -6
  object_text: 'a safety requirement inherits the ASIL of the requirement it is derived from; it may
    get a lower one only by an ASIL decomposition into redundant safety requirements, realized by
    sufficiently independent elements'
  applies_to: automotive
  priority: 'medium'
  safety: ''
  status: approved
  verification_method: [inspection]
- object_key: REG-20
  object_version: '1.1.1'
  category: Safety classes
  source: 'ARP4754B, 5.2.1 to 5.2.3; DO-178C, 2.3'
  object_text: 'a function gets its FDAL from the severity of its failure conditions in the functional
    hazard assessment; an item gets the IDAL that follows from the function it realizes, and its
    software the software level that follows from the severity of the failure conditions it can
    contribute to; a lower level only by a decomposition into independent, redundant items'
  applies_to: airborne
  priority: 'medium'
  safety: ''
  status: approved
  verification_method: [inspection]
- object_key: REG-21
  object_version: '1.1.1'
  category: Safety classes
  source: 'IEC 61508-1, 7.6.2.9; IEC 61508-2, 7.4.3; IEC 61508-4, 3.5.8'
  object_text: 'a safety function has a SIL, one of four discrete levels of its safety integrity
    requirements; each SIL sets the target failure measure a system has to reach - a probability of
    dangerous failure on demand (PFD) or per hour (PFH); systematic faults - design defects, software
    bugs, specification errors - are controlled, and the systematic capability is stated in four levels,
    SC 1 to SC 4'
  applies_to: industry, railway (EN 50716)
  priority: 'medium'
  safety: ''
  status: approved
  verification_method: [inspection]
- object_key: REG-22
  object_version: '1.1.1'
  category: Safety classes
  source: IEC 62304, 4.3; 5.3.5
  object_text: a software item gets the software safety class of the software system or item it is decomposed
    from; a lower class only with a documented rationale, such as a segregation of the items
  applies_to: medical
  priority: 'medium'
  safety: ''
  status: approved
  verification_method: [inspection]
- object_key: REG-14
  object_version: '1.1.1'
  category: Products on the market
  source: CRA (EU) 2024/2847, Annex I Part I
  object_text: 'a product with digital elements is designed and produced for a level of cybersecurity
    appropriate to its risks, and placed on the market without known exploitable vulnerabilities, with a
    secure configuration by default, securable by updates, and with the further properties of Annex I
    Part I (2)'
  applies_to: products with digital elements made available on the EU market in the course of a
    commercial activity - not free and open-source software that is not monetised
  priority: 'medium'
  safety: ''
  status: approved
  verification_method: [inspection]
- object_key: REG-15
  object_version: '1.1.1'
  category: Products on the market
  source: CRA, Annex I Part II
  object_text: 'the manufacturer handles vulnerabilities: keeps an SBOM, fixes without delay, tests
    and reviews the product regularly, discloses fixed vulnerabilities, has a policy of coordinated
    disclosure and a contact for reports, and distributes security updates securely, without delay and
    free of charge'
  applies_to: products with digital elements made available on the EU market in the course of a
    commercial activity - not free and open-source software that is not monetised
  priority: 'medium'
  safety: ''
  status: approved
  verification_method: [inspection]
- object_key: REG-16
  object_version: '1.1.1'
  category: Products on the market
  source: CRA, Art. 14
  object_text: 'an actively exploited vulnerability is notified to the CSIRT designated as coordinator
    and to ENISA: an early warning within 24 hours, a notification within 72 hours, a final report
    within 14 days after a corrective or mitigating measure is available'
  applies_to: products with digital elements made available on the EU market in the course of a
    commercial activity - not free and open-source software that is not monetised
  not_realized: a duty of the manufacturer, kept by our work (harness)
  priority: 'medium'
  safety: ''
  status: approved
  verification_method: [inspection]
- object_key: REG-17
  object_version: '1.1.1'
  category: Products on the market
  source: CRA, Art. 13(8)
  object_text: 'vulnerabilities are handled over the support period, at least five years unless the
    product is expected to be in use for a shorter time'
  applies_to: products with digital elements made available on the EU market in the course of a
    commercial activity - not free and open-source software that is not monetised
  priority: 'medium'
  safety: ''
  status: approved
  verification_method: [inspection]
- object_key: REG-18
  object_version: '1.1.1'
  category: Products on the market
  source: licences of the components, e.g. Apache-2.0 §4
