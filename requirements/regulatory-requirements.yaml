    disclosure and a contact for reports, and distributes security updates securely, without delay and
    free of charge'
  applies_to: products with digital elements made available on the EU market in the course of a
    commercial activity - not free and open-source software that is not monetised
  priority: 'medium'
  safety: ''
  status: review
  verification_method: [inspection]
