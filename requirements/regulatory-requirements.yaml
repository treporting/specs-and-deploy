requirements:
- object_key: REG-01
  object_version: '1.1.1'
  category: Tool qualification
  source: ISO 26262-8, clause 11
  object_text: classify a software tool by its impact and by how surely its errors are detected (TI, TD,
    TCL), and qualify it where the confidence level is TCL2 or TCL3
  applies_to: automotive
  priority: 'medium'
  safety: ''
  status: draft
  verification_method: [inspection]
- object_key: REG-02
  object_version: '1.1.1'
  category: Tool qualification
  source: IEC 61508-3, 7.4.4
  object_text: show that an offline support tool of class T2, which can fail to reveal a defect, is fit
    for its use
  applies_to: industry, railway (EN 50716)
  priority: 'medium'
  safety: ''
  status: draft
  verification_method: [inspection]
- object_key: REG-03
  object_version: '1.1.1'
  category: Tool qualification
  source: DO-330
  object_text: qualify a verification tool whose output is not verified otherwise
  applies_to: airborne
  priority: 'medium'
  safety: ''
  status: draft
  verification_method: [inspection]
- object_key: REG-04
  object_version: '1.1.1'
  category: Tool qualification
  source: ISO 13485, 4.1.6
  object_text: validate software used in the quality management system before its first use and after
    changes
  applies_to: medical
  priority: 'medium'
  safety: ''
  status: draft
  verification_method: [inspection]
- object_key: REG-05
  object_version: '1.1.1'
  category: Electronic records
  source: 21 CFR 11.10(e)
  object_text: keep a secure, computer-generated audit trail with time stamps of every creation, change
    and deletion of a record, without hiding what was there before
  applies_to: medical (FDA)
  priority: 'medium'
  safety: ''
  status: draft
  verification_method: [inspection]
