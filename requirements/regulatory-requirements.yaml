  category: Products on the market
  source: CRA, Art. 14
  object_text: 'an actively exploited vulnerability is notified to the CSIRT designated as coordinator
    and to ENISA: an early warning within 24 hours, a notification within 72 hours, a final report
    within 14 days after a corrective or mitigating measure is available'
  applies_to: products with digital elements made available on the EU market in the course of a
    commercial activity - not free and open-source software that is not monetised
  not_realized: a duty of the manufacturer, kept by our work (harness)
  priority: 'medium'
  safety: ''
