  object_text: data are attributable, legible, contemporaneous, original and accurate - every figure can
    be followed back to whom and what it comes from
  applies_to: medical (FDA)
  priority: 'medium'
  safety: ''
  status: draft
  verification_method: [inspection]
- object_key: REG-11
  object_version: '1.1.1'
