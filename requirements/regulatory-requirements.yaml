  verification_method: [inspection]
- object_key: REG-19
  object_version: '1.1.1'
  category: Safety classes
  source: ISO 26262-9, clause 5; ISO 26262-3, -4, -6
  object_text: a safety requirement inherits the ASIL of the requirement it is derived from; it may get
    a lower one only by an ASIL decomposition into independent requirements
  applies_to: automotive
  priority: 'medium'
  safety: ''
  status: draft
  verification_method: [inspection]
- object_key: REG-20
  object_version: '1.1.1'
  category: Safety classes
  source: ARP4754B, development assurance level assignment; DO-178C, 2.3
  object_text: an item gets the development assurance level (IDAL) of the function it realizes (FDAL),
    and its software the software level that follows from it; a lower level only where independence between
    the items is shown
  applies_to: airborne
  priority: 'medium'
  safety: ''
  status: draft
  verification_method: [inspection]
- object_key: REG-21
  object_version: '1.1.1'
  category: Safety classes
  source: IEC 61508-2, 7.4.3; IEC 61508-3, 7.4.2.8 to 7.4.2.10
  object_text: an element gets the SIL of the safety function it realizes; software elements of different
    SIL are all treated as of the highest one, unless their independence is shown
  applies_to: industry, railway (EN 50716)
  priority: 'medium'
  safety: ''
  status: draft
  verification_method: [inspection]
- object_key: REG-22
  object_version: '1.1.1'
  category: Safety classes
  source: IEC 62304, 4.3; 5.3.5
  object_text: a software item gets the software safety class of the software system or item it is decomposed
    from; a lower class only with a documented rationale, such as a segregation of the items
  applies_to: medical
  priority: 'medium'
  safety: ''
  status: draft
  verification_method: [inspection]
- object_key: REG-14
  object_version: '1.1.1'
  category: Products on the market
  source: CRA (EU) 2024/2847, Annex I Part I
  object_text: a product with digital elements is placed on the market without known exploitable vulnerabilities,
